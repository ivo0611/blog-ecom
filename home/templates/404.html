{% extends "base.html" %}
{% load static %}

<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #ff7e5f, #feb47b);
            text-align: center;
            padding: 50px 20px;
            color: #fff;
        }

        h1 {
            font-size: 72px;
            margin: 0;
            font-weight: bold;
        }

        p {
            font-size: 20px;
            margin: 20px 0;
        }

        .notfound-img {
            max-width: 100%;
            height: auto;
            margin: 30px 0;
        }

        .btn-home {
            background-color: #fff;
            color: #ff7e5f;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            text-decoration: none;
            transition: 0.3s;
        }

        .btn-home:hover {
            background-color: #ff7e5f;
            color: #fff;
        }
    </style>
</head>
<body>

    <h1>Oops! 404</h1>
    <p>Trang bạn tìm kiếm không tồn tại hoặc đã bị xóa.</p>
    <img src="https://via.placeholder.com/500x300?text=404+Not+Found" alt="Not Found" class="notfound-img">
    <a href="/" class="btn-home">Quay lại Trang Chủ</a>

</body>
</html>
